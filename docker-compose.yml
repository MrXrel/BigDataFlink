services:
  postgres:
    image: postgres:15-alpine
    container_name: bdflink_postgres
    environment:
      POSTGRES_DB: pet_sales_dw
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink_pass
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d pet_sales_dw"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    container_name: bdflink_kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  jobmanager:
    build:
      context: ./docker/flink
    container_name: bdflink_jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pet_sales_events
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pet_sales_dw
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink_pass

  taskmanager:
    build:
      context: ./docker/flink
    container_name: bdflink_taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pet_sales_events
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/pet_sales_dw
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink_pass

  producer:
    build:
      context: ./producer
    container_name: bdflink_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: pet_sales_events
      DATA_DIR: /data
      PUBLISH_DELAY_MS: 1
      FLUSH_EVERY: 500
    volumes:
      - "./исходные данные:/data:ro"
    restart: "no"
